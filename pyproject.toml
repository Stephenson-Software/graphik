[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphik"
dynamic = ["version"]
description = "Simple helper methods for graphics programming with pygame."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel McCoy Stephenson" }]
dependencies = ["pygame"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
test = ["pytest"]
# The 3D grid view (preponderous.graphik.grid3d) draws with Strata's Python
# binding. It isn't on PyPI, so it is installed from the Strata release tag;
# graphik itself is installed from tag archives too, never from PyPI, so a
# direct reference here is allowed.
strata = [
    "strata-engine @ git+https://github.com/Preponderous-Software/strata@v0.7.0#subdirectory=bindings/python",
]

[project.urls]
Homepage = "https://github.com/Stephenson-Software/graphik"

[tool.setuptools]
package-dir = { "" = "src/main/python" }

[tool.setuptools.packages.find]
where = ["src/main/python"]

[tool.setuptools.dynamic]
version = { attr = "preponderous.graphik._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["src/test/python"]
pythonpath = ["src/main/python"]
