# Runs the test suite on every push and pull request so regressions are
# caught before merge, rather than relying solely on manual local validation.
# See RELEASING.md for releases; publish.yml (manual-only PyPI publish) is separate.
name: Test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    # Named by interpreter alone, so the check names stay Compile and test (3.9) etc.
    name: Compile and test (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every version pygame ships a prebuilt wheel for (see
        # https://pypi.org/project/pygame/#files), matching requires-python
        # in pyproject.toml. Anything outside this range would force a
        # from-source build that fails on the runner (missing SDL/freetype
        # dev headers), so the declared floor and the tested floor must
        # stay in lockstep.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # setup-python publishes no 3.9 build for the Ubuntu 26.04 image
          # ubuntu-latest now resolves to, so the 3.9 floor is pinned.
          - python-version: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[test]

      - name: Compile check
        run: python -m py_compile src/main/python/preponderous/graphik/graphik.py

      - name: Import smoke test
        run: python -c "import preponderous.graphik as g; print(g.__version__)"

      - name: Run tests (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest

  grid3d-render:
    # The rest of the suite runs without Strata, so its render tests (a board
    # drawn headless and compared with golden/board-4x3.png, a frame mid-tick)
    # skip there. This job installs the strata extra and draws them for real,
    # headless through EGL on Mesa's llvmpipe (no GPU, no display), and
    # GRAPHIK_REQUIRE_STRATA turns a skip into a failure. The binding fetches
    # the pinned Strata release library (view.STRATA_VERSION, set in
    # adapters/binding_strata_loader.py) from GitHub and
    # checks its SHA-256. The browser backend has no render here: Strata's own
    # CI draws the grid relay in Chromium against desktop stills.
    name: grid3d render (Strata, llvmpipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mesa (EGL, llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2

      - name: Install package with test and strata dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,strata]"

      - name: grid3d tests, rendering included
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          GALLIUM_DRIVER: llvmpipe
          GRAPHIK_REQUIRE_STRATA: "1"
        run: python -m pytest -rs src/test/python/preponderous/graphik/grid3d

  archive-install:
    # Consumers install graphik from a release tag's source archive, e.g.
    #   graphik @ https://github.com/Stephenson-Software/graphik/archive/refs/tags/v0.3.0.zip
    # (see RELEASING.md). This job builds the same kind of archive from the
    # commit under test -- a zip with one top-level graphik-<version>/ folder,
    # as GitHub serves it -- installs it into a fresh venv the way a consumer's
    # `pip install -r requirements.txt` would, and draws with it. Unlike an
    # import of the package alone, drawing loads graphik.py and pygame, so a
    # build that dropped either fails here. An archive install never calls git.
    name: Install from a release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build a GitHub-style source archive
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "src/main/python"); from preponderous.graphik._version import __version__; print(__version__)')"
          git archive --format=zip --prefix="graphik-${VERSION}/" -o "$RUNNER_TEMP/graphik.zip" HEAD
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install the archive into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/consumer/bin/python" -m pip install "graphik @ file://$RUNNER_TEMP/graphik.zip"

      - name: Import and draw with the installed package
        # Run from outside the checkout so only the installed copy is importable.
        working-directory: ${{ runner.temp }}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          "$RUNNER_TEMP/consumer/bin/python" - <<'PY'
          import os
          import pygame
          import preponderous.graphik as package
          from preponderous.graphik import Graphik
          # grid3d's subpackages and page template ship in the archive too
          from preponderous.graphik.grid3d import adapters, ports, web
          assert os.path.isfile(web.templatePath()), web.templatePath()
          assert "site-packages" in adapters.__file__ and ports.SceneRenderer

          assert package.__version__ == os.environ["VERSION"], package.__version__
          assert "site-packages" in package.__file__, package.__file__
          surface = pygame.Surface((20, 20))
          Graphik(surface).drawRectangle(2, 2, 10, 10, Graphik.red)
          assert tuple(surface.get_at((5, 5)))[:3] == Graphik.red
          print("installed graphik", package.__version__, "draws OK from", package.__file__)
          PY
