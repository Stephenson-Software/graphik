# Runs the test suite on every push and pull request so regressions are
# caught before merge, rather than relying solely on manual local validation.
# See RELEASING.md / publish.yml for the separate publish-on-tag workflow.
name: Test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned rather than "3.x": pygame only ships prebuilt wheels up to
          # cp313 (see https://pypi.org/project/pygame/#files), and installing
          # on a newer interpreter forces a from-source build that fails on
          # the runner (missing SDL/freetype dev headers).
          python-version: "3.13"

      - name: Install package with test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[test]

      - name: Compile check
        run: python -m py_compile src/main/python/preponderous/graphik/graphik.py

      - name: Import smoke test
        run: python -c "import preponderous.graphik as g; print(g.__version__)"

      - name: Run tests (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest
